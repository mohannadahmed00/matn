<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes subtle-pulse {
            0%, 100% { opacity: 0.4; transform: scaleX(0.98); }
            50% { opacity: 0.8; transform: scaleX(1.02); }
        }

        .animate-subtle-pulse {
            animation: subtle-pulse 4s ease-in-out infinite;
        }

        @keyframes logo-reveal {
            0% { opacity: 0; transform: translateY(10px); filter: blur(4px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .reveal {
            animation: logo-reveal 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .canvas-grain {
            background-image: url("https://www.transparenttextures.com/patterns/felt.png");
            opacity: 0.03;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md overflow-hidden antialiased">
<!-- Grain Overlay for Digital Paper Feel -->
<div class="fixed inset-0 canvas-grain z-0"></div>
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-margin-mobile md:px-margin-desktop">
<!-- Center Brand Container -->
<div class="flex flex-col items-center max-w-sm w-full text-center">
<!-- Logo Section -->
<div class="reveal mb-12 flex justify-center">
<div class="relative group">
<!-- Subtle Glow Backdrop -->
<div class="absolute -inset-4 bg-primary/5 blur-3xl rounded-full transition-all duration-1000 group-hover:bg-primary/10"></div>
<!-- Main Logo Image -->
<img alt="Matn Logo" class="relative w-32 h-32 md:w-40 md:h-40 object-contain drop-shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC1aE43cqav2lvGzldxoXbbVlO9LVQYswAmdkp8AFT5dqu2nqOuSE9r_yuSLz0NP53_JQzuttvetM9LLrI_0HW2r0P_y0DJkvkglQ_lWrDIQVi_O36hU_qT_M21sGOBV9wNfa97NO4vNRYQGOjaQQ4xudIv62V9YBqNB9RXbs-Ixqzi2VYTH6Ii0sDqM79dMULOXHPRdj5nfoJdrDHYWl1bB_ko_6tM0Kq8UNcuW7CstRdzbM4KWRg-qKUAykq2m_5N0af3dFQVHqU"/>
</div>
</div>
<!-- Brand Name Section -->
<div class="reveal" style="animation-delay: 0.4s; opacity: 0;">
<h1 class="font-display-ar text-display-ar text-primary tracking-tight mb-2">
                    المتن
                </h1>
<p class="font-label-sm text-label-sm uppercase tracking-[0.2em] text-outline opacity-70">
                    Sakinah for Seekers
                </p>
</div>
<!-- Loading Indicator -->
<div class="reveal mt-20 w-32 md:w-48" style="animation-delay: 0.8s; opacity: 0;">
<div class="h-[1px] w-full bg-outline-variant relative overflow-hidden rounded-full">
<!-- Progress Line -->
<div class="absolute inset-0 bg-primary w-0 transition-all duration-[3000ms] ease-out" id="progress-bar"></div>
</div>
<p class="mt-4 font-label-sm text-label-sm text-on-surface-variant/60 animate-subtle-pulse italic">
                    Preparing your workspace...
                </p>
</div>
</div>
<!-- Atmospheric Quote (Fades in last) -->
<div class="absolute bottom-16 reveal text-center" style="animation-delay: 1.5s; opacity: 0;">
<p class="font-body-ar text-secondary italic opacity-80 max-w-md px-6">
                "إنما العلم بالتعلم، وإنما الحلم بالتحلم"
            </p>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            
            // Start the progress simulation
            setTimeout(() => {
                progressBar.style.width = '100%';
            }, 1000);

            // Optional: Transition to main app logic after loading
            // setTimeout(() => {
            //    document.body.style.opacity = '0';
            //    document.body.style.transition = 'opacity 1s ease-in-out';
            // }, 4500);
        });
    </script>
</body></html>
