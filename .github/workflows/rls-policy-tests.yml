name: RLS Policy Tests

# FR-036/FR-042 (`specs/011-teacher-authoring-upload/research.md` D9): the row-level-security
# policies are load-bearing — the only gate on student visibility — so they must be exercised
# against a real Postgres, not just reviewed. `RlsPolicyTest` skips itself when the stack env vars
# are unset (`shared/src/jvmTest/kotlin/com/giraffe/matn/remote/SupabaseTestSupport.kt`); this job
# is what actually runs it, against the local stack `supabase start` brings up from
# `supabase/migrations`.

on:
  pull_request:
    paths:
      - "supabase/**"
      - "shared/src/jvmTest/kotlin/com/giraffe/matn/remote/**"
      - "shared/src/commonMain/kotlin/com/giraffe/matn/data/remote/**"
      - ".github/workflows/rls-policy-tests.yml"
  workflow_dispatch:

jobs:
  rls-policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Studio and the mail catcher are not exercised by any test; skipping them keeps the job
      # well under the time the Firebase emulator job used to take.
      - name: Start the local Supabase stack
        run: supabase start -x studio,inbucket,imgproxy,edge-runtime,logflare,vector

      - name: Export the stack's credentials for the test
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_TEST_URL=$API_URL"
            echo "SUPABASE_TEST_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Run RlsPolicyTest
        run: ./gradlew :shared:jvmTest --tests 'com.giraffe.matn.remote.RlsPolicyTest'

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup
