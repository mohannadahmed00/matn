name: Security Rules Tests

# FR-036/FR-042 (`specs/011-teacher-authoring-upload/research.md` D9): the Firestore rules are
# load-bearing — the only gate on student visibility — so they must be exercised against a real
# emulator, not just reviewed. `SecurityRulesTest` skips itself locally when FIREBASE_EMULATOR_HOST
# is unset (`shared/src/jvmTest/kotlin/com/giraffe/matn/remote/EmulatorTestSupport.kt`); this job is
# what actually runs it. Storage cases were retired when Storage moved to Supabase — see
# `specs/011-teacher-authoring-upload/design-notes.md`.

on:
  pull_request:
    paths:
      - "firebase/**"
      - "shared/src/jvmTest/kotlin/com/giraffe/matn/remote/**"
      - "shared/src/commonMain/kotlin/com/giraffe/matn/data/remote/**"
      - ".github/workflows/security-rules-tests.yml"
  workflow_dispatch:

jobs:
  security-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools

      - name: Run SecurityRulesTest against the Firebase Local Emulator Suite
        working-directory: firebase
        env:
          FIREBASE_EMULATOR_HOST: 127.0.0.1
        run: |
          firebase emulators:exec --only firestore,auth \
            "cd .. && ./gradlew :shared:jvmTest --tests 'com.giraffe.matn.remote.SecurityRulesTest'"
