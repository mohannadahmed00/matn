# Local Supabase stack, used by `supabase start` and by the RLS job in
# `.github/workflows/rls-policy-tests.yml`. Only the pieces the teacher tool touches are enabled.
project_id = "matn"

[api]
enabled = true
port = 54321
# `private` is deliberately absent: `private.is_teacher()` is a policy helper, not an endpoint.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# The RLS test signs teachers up on the fly; a confirmation mail would stall it.
enable_confirmations = false

[storage]
enabled = true

[storage.buckets.matn-content]
public = false
# FR-016, enforced server-side. Phase 12 extends this list with the audio types.
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[studio]
enabled = false

[inbucket]
enabled = false

[analytics]
enabled = false
